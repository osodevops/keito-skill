name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, codex/keito-time-track-skill-review]
  pull_request:
    branches: [main, codex/keito-time-track-skill-review]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Shell Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck

      - name: Syntax check
        run: |
          bash -n keito-time-track/hooks/session-start.sh keito-time-track/hooks/session-end.sh \
            keito-time-track/scripts/setup-wizard.sh keito-time-track/scripts/status.sh \
            keito-time-track/scripts/disable.sh keito-time-track/scripts/install-cli.sh \
            keito-time-track/installers/install-codex.sh \
            keito-time-track/installers/install-claude-code.sh tests/run.sh

      - name: ShellCheck
        run: shellcheck -P keito-time-track keito-time-track/hooks/session-start.sh keito-time-track/hooks/session-end.sh keito-time-track/hooks/lib/*.sh keito-time-track/scripts/*.sh keito-time-track/installers/*.sh tests/run.sh

      - name: Validate Agent Skill
        run: npx --yes skills-ref@0.1.5 validate keito-time-track

      - name: Run skill tests
        run: tests/run.sh

  security:
    name: Security Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Reject floating skills installer versions
        run: |
          floating_latest='skills@''latest'
          floating_npx='npx[[:space:]]+skills[[:space:]]+add'
          if git grep -nE "${floating_latest}|${floating_npx}" -- .; then
            echo "::error::Use an exact skills npm package version, for example skills@1.5.6"
            exit 1
          fi

      - name: Reject unpinned workflow actions
        run: |
          if git grep -nE 'uses:[[:space:]]+[^#]+@(v[0-9]+|main|master|latest)' -- .github/workflows; then
            echo "::error::GitHub Actions must be pinned to full commit SHAs"
            exit 1
          fi
